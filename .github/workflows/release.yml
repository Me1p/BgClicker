name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode code-signing certificate
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:CERT_BASE64)) {
            $bytes = [Convert]::FromBase64String($env:CERT_BASE64)
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", $bytes)
            Write-Host "Certificate decoded."
          } else {
            Write-Host "No certificate secret; building unsigned."
          }

      - name: Build and sign
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (Test-Path "$env:RUNNER_TEMP\cert.pfx") {
            ./build.ps1 -CertificatePath "$env:RUNNER_TEMP\cert.pfx" -CertificatePassword $env:CERT_PASSWORD
          } else {
            ./build.ps1
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/BgClicker.exe
            dist/BgClicker.exe.config
            dist/README.md
            dist/LICENSE
            dist/SHA256SUMS.txt
