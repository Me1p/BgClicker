name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BgClicker
          path: |
            dist/BgClicker.exe
            dist/BgClicker.exe.config
            dist/README.md
            dist/LICENSE
            dist/SHA256SUMS.txt
